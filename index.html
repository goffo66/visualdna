<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAPSHOT! - Visual DNA</title>
    <style>
        :root {
            --bg-color: #08090C;
            --card-bg: #12151C;
            --text-primary: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-gold: #D97706;
            --accent-gold-light: #F59E0B;
            --pass-color: #EF4444;
            --like-color: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 16px;
            overflow: hidden;
        }

        /* Header Section */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }

        .brand-title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 12px;
        }

        .brand-title .snap {
            color: var(--text-primary);
            font-weight: 900;
        }

        .brand-title .shot {
            color: var(--accent-gold-light);
            font-weight: 300;
        }

        .pill-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 50px;
            padding: 6px 18px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        .pill-badge span {
            color: var(--accent-gold-light);
            font-style: italic;
        }

        .slogan {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .slogan .action {
            font-style: italic;
            color: var(--accent-gold-light);
            display: block;
            font-size: 1.4rem;
        }

        /* Main Phone / Card Stage */
        .stage-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }

        .swipe-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            z-index: 1;
        }

        .swipe-label.left { left: -10px; }
        .swipe-label.right { right: -10px; }

        .swipe-label .arrow {
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .card-frame {
            width: 240px;
            height: 380px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 4px solid #1E222D;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Controls Section */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        .button-row {
            display: flex;
            gap: 24px;
            margin-bottom: 8px;
        }

        .action-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .btn-pass {
            background-color: var(--pass-color);
            color: white;
        }

        .btn-like {
            background-color: var(--like-color);
            color: white;
        }

        .action-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sub-instruction {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .sub-instruction strong {
            color: var(--text-primary);
        }

        /* Footer Link */
        .footer-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px;
            opacity: 0.7;
        }

        .footer-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-container">
        <h1 class="brand-title"><span class="snap">SNAP</span><span class="shot">SHOT!</span></h1>
        <div class="pill-badge">YOUR <strong>VISUAL DNA</strong> IN <span>60 SECONDS!</span></div>
        <div class="slogan">
            IF YOU FEEL IT,
            <span class="action">SWIPE IT!</span>
        </div>
    </div>

    <!-- Interactive Card Stage -->
    <div class="stage-container">
        <div class="swipe-label left">
            <span class="arrow">&larr;</span>
            <span>Skip</span>
        </div>

        <div class="card-frame">
            <img class="card-image" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Sample Photography">
        </div>

        <div class="swipe-label right">
            <span class="arrow">&rarr;</span>
            <span>Like it</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-container">
        <div class="button-row">
            <button class="action-btn btn-pass" aria-label="Skip">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <button class="action-btn btn-like" aria-label="Like">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
        </div>
        <div class="sub-instruction">or use <strong>buttons</strong></div>
    </div>

    <!-- Discreet Privacy Link -->
    <div class="footer-link">How we protect your test data</div>

</body>
</html>
