<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAPSHOT! - Visual DNA (Build v7.0)</title>
    <style>
        :root {
            --bg-color: #08090C;
            --card-bg: #12151C;
            --text-primary: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-gold-light: #F59E0B;
            --pass-color: #EF4444;
            --like-color: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 6px;
        }

        .brand-title {
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 3px;
        }

        .brand-title .snap { color: var(--text-primary); }
        .brand-title .shot { color: var(--accent-gold-light); font-weight: 300; }

        .version-tag {
            font-size: 0.5rem;
            color: var(--accent-gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 3px;
            opacity: 0.8;
        }

        .pill-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 50px;
            padding: 3px 12px;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 3px;
            backdrop-filter: blur(10px);
        }

        .pill-badge span { color: var(--accent-gold-light); font-style: italic; }

        .slogan {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.1;
            color: var(--text-primary);
            transition: opacity 0.3s ease;
        }

        .slogan .action {
            font-style: italic;
            color: var(--accent-gold-light);
            display: block;
            font-size: 1.1rem;
        }

        .progress-bar-container {
            width: 160px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 6px;
            display: none;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gold-light);
            transition: width 0.2s ease;
        }

        .stage-container {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .card-stack {
            position: relative;
            width: 180px;
            height: 250px;
            touch-action: none;
        }

        .card-frame {
            position: absolute;
            inset: 0;
            background: var(--card-bg);
            border-radius: 16px;
            border: 3px solid #1E222D;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        }

        .card-static {
            z-index: 1;
            transform: scale(0.96);
            border-color: #171a22;
            opacity: 0.85;
        }

        .card-active {
            z-index: 2;
            transform: rotate(5deg) translateX(12px);
            cursor: grab;
        }

        .card-active.dragging {
            box-shadow: 0 16px 35px rgba(0,0,0,0.9);
            cursor: grabbing;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
        }

        .gesture-hint {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 150px;
            height: 150px;
            opacity: 0.9;
            z-index: 3;
            transition: opacity 0.3s ease;
            pointer-events: none;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.85));
        }

        .gesture-hint svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
            gap: 10px;
            margin-bottom: 10px;
        }

        .button-row {
            display: flex;
            gap: 20px;
        }

        .action-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            opacity: 0.85;
        }

        .btn-pass { background-color: var(--pass-color); color: white; }
        .btn-like { background-color: var(--like-color); color: white; }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sub-instruction { 
            font-size: 0.65rem; 
            color: var(--text-muted); 
        }
        .sub-instruction strong { color: var(--text-primary); }

        .primary-start-btn {
            background-color: var(--like-color);
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 12px 32px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            margin-top: 4px;
        }

        .footer-link {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.7;
        }

        /* Results Modal & Analytics Styles */
        .results-modal {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .results-header-title {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-align: center;
        }

        .results-header-subtitle {
            font-size: 0.65rem;
            color: var(--accent-gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
            text-align: center;
        }

        .toggle-container {
            display: flex;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 3px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 16px;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 8px 0;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .toggle-btn.active {
            background: #3B82F6;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .results-card-container {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .stat-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .stat-card-title {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .stat-card-value {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--like-color);
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .stat-card-desc {
            font-size: 0.65rem;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .feedback-section {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            margin-bottom: 20px;
        }

        .feedback-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .feedback-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .feedback-btns {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .fb-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .fb-btn.selected {
            border-color: var(--accent-gold-light);
            background: rgba(245, 158, 11, 0.15);
        }

        .finish-btn {
            background: #3B82F6;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            font-weight: 800;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246,.4);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="brand-title"><span class="snap">SNAP</span><span class="shot">SHOT!</span></h1>
        <div class="version-tag">Build v7.0</div>
        <div class="pill-badge">YOUR <strong>VISUAL DNA</strong> IN <span>60 SECONDS!</span></div>
        <div class="slogan" id="sloganEl">
            IF YOU FEEL IT,
            <span class="action">SWIPE IT!</span>
        </div>
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="stage-container">
        <div class="gesture-hint" id="gestureHint">
            <svg viewBox="0 0 120 120">
                <path d="M 15,95 C 30,35 80,30 105,50" />
                <path d="M 92,38 L 107,52 L 90,62" />
            </svg>
        </div>

        <div class="card-stack">
            <!-- Static Background Card -->
            <div class="card-frame card-static">
                <img class="card-image" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="Stacked Teaser">
            </div>

            <!-- Active Foreground Card -->
            <div class="card-frame card-active" id="cardActive">
                <img class="card-image" id="cardImg" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="Visual Teaser">
            </div>
        </div>
    </div>

    <div class="controls-container">
        <div class="button-row" id="buttonRow">
            <button class="action-btn btn-pass" id="btnPass" onclick="window.handleChoice(false)" aria-label="Skip">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <button class="action-btn btn-like" id="btnLike" onclick="window.handleChoice(true)" aria-label="Like">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
        </div>
        <div class="sub-instruction" id="subInstruction">or use <strong>buttons</strong></div>

        <button class="primary-start-btn" id="startBtn" onclick="window.triggerStartTest()">START TEST</button>
    </div>

    <div class="footer-link">How we protect your test data</div>

    <!-- Results Modal -->
    <div class="results-modal" id="resultsModal">
        <div class="results-header-title">Your Visual DNA Profile</div>
        <div class="results-header-subtitle">What it means for you...</div>

        <div class="toggle-container">
            <button class="toggle-btn active" id="viewerTab" onclick="window.setMode('viewer')">AS A VIEWER</button>
            <button class="toggle-btn" id="photogTab" onclick="window.setMode('photographer')">AS A PHOTOGRAPHER</button>
        </div>

        <div class="results-card-container" id="resultsContent">
            <!-- Dynamically generated scorecards inserted here -->
        </div>

        <div class="feedback-section">
            <div class="feedback-title">Test Complete</div>
            <div class="feedback-subtitle">How did you find the experience?</div>
            <div class="feedback-btns">
                <div class="fb-btn" onclick="window.setFeedback(this)">✕</div>
                <div class="fb-btn" onclick="window.setFeedback(this)">–</div>
                <div class="fb-btn" onclick="window.setFeedback(this)">✓</div>
            </div>
            <button class="finish-btn" onclick="window.closeResults()">FINISH & CLOSE</button>
        </div>
    </div>

    <script>
        const deck = [
            { url: "images/Arch_bw_1.jpg", cat: "Arch", bw: true },
            { url: "images/Arch_bw_2.jpg", cat: "Arch", bw: true },
            { url: "images/Arch_bw_3.jpg", cat: "Arch", bw: true },
            { url: "images/Arch_bw_4.jpg", cat: "Arch", bw: true },
            { url: "images/Arch_bw_5.jpg", cat: "Arch", bw: true },
            { url: "images/Arch_col_1.jpg", cat: "Arch", bw: false },
            { url: "images/Arch_col_2.jpg", cat: "Arch", bw: false },
            { url: "images/Arch_col_3.jpg", cat: "Arch", bw: false },
            { url: "images/Arch_col_4.jpg", cat: "Arch", bw: false },
            { url: "images/Arch_col_5.jpg", cat: "Arch", bw: false },
            { url: "images/Creative_bw_1.jpg", cat: "Creative", bw: true },
            { url: "images/Creative_bw_2.jpg", cat: "Creative", bw: true },
            { url: "images/Creative_bw_3.jpg", cat: "Creative", bw: true },
            { url: "images/Creative_bw_4.jpg", cat: "Creative", bw: true },
            { url: "images/Creative_bw_5.jpg", cat: "Creative", bw: true },
            { url: "images/Creative_col_1.jpg", cat: "Creative", bw: false },
            { url: "images/Creative_col_2.jpg", cat: "Creative", bw: false },
            { url: "images/Creative_col_3.jpg", cat: "Creative", bw: false },
            { url: "images/Creative_col_4.jpg", cat: "Creative", bw: false },
            { url: "images/Creative_col_5.jpg", cat: "Creative", bw: false },
            { url: "images/Human_bw_1.jpg", cat: "Human", bw: true },
            { url: "images/Human_bw_2.jpg", cat: "Human", bw: true },
            { url: "images/Human_bw_3.jpg", cat: "Human", bw: true },
            { url: "images/Human_bw_4.jpg", cat: "Human", bw: true },
            { url: "images/Human_bw_5.jpg", cat: "Human", bw: true },
            { url: "images/Human_col_1.jpg", cat: "Human", bw: false },
            { url: "images/Human_col_2.jpg", cat: "Human", bw: false },
            { url: "images/Human_col_3.jpg", cat: "Human", bw: false },
            { url: "images/Human_col_4.jpg", cat: "Human", bw: false },
            { url: "images/Human_col_5.jpg", cat: "Human", bw: false },
            { url: "images/Nat_bw_1.jpg", cat: "Nature", bw: true },
            { url: "images/Nat_bw_2.jpg", cat: "Nature", bw: true },
            { url: "images/Nat_bw_3.jpg", cat: "Nature", bw: true },
            { url: "images/Nat_bw_4.jpg", cat: "Nature", bw: true },
            { url: "images/Nat_bw_5.jpg", cat: "Nature", bw: true },
            { url: "images/Nat_col_1.jpg", cat: "Nature", bw: false },
            { url: "images/Nat_col_2.jpg", cat: "Nature", bw: false },
            { url: "images/Nat_col_3.jpg", cat: "Nature", bw: false },
            { url: "images/Nat_col_4.jpg", cat: "Nature", bw: false },
            { url: "images/Nat_col_5.jpg", cat: "Nature", bw: false },
            { url: "images/Street_bw_1.jpg", cat: "Street", bw: true },
            { url: "images/Street_bw_2.jpg", cat: "Street", bw: true },
            { url: "images/Street_bw_3.jpg", cat: "Street", bw: true },
            { url: "images/Street_bw_4.jpg", cat: "Street", bw: true },
            { url: "images/Street_bw_5.jpg", cat: "Street", bw: true },
            { url: "images/Street_col_1.jpg", cat: "Street", bw: false },
            { url: "images/Street_col_2.jpg", cat: "Street", bw: false },
            { url: "images/Street_col_3.jpg", cat: "Street", bw: false },
            { url: "images/Street_col_4.jpg", cat: "Street", bw: false },
            { url: "images/Street_col_5.jpg", cat: "Street", bw: false }
        ];

        let currentIndex = 0;
        let active = false;
        let currentMode = 'viewer';
        let stats = {
            likedTotal: 0,
            bwLikes: 0,
            cats: { Arch: 0, Creative: 0, Human: 0, Nature: 0, Street: 0 }
        };

        const cardActive = document.getElementById('cardActive');
        const cardImg = document.getElementById('cardImg');
        const startBtn = document.getElementById('startBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const sloganEl = document.getElementById('sloganEl');
        const resultsModal = document.getElementById('resultsModal');
        const gestureHint = document.getElementById('gestureHint');

        window.triggerStartTest = function() {
            startBtn.style.display = 'none';
            sloganEl.classList.add('hidden');
            gestureHint.style.opacity = '0';
            cardActive.style.transform = 'none';
            progressContainer.style.display = 'block';

            currentIndex = 0;
            stats.likedTotal = 0;
            stats.bwLikes = 0;
            stats.cats = { Arch: 0, Creative: 0, Human: 0, Nature: 0, Street: 0 };
            active = true;
            loadCard();
        };

        function loadCard() {
            if (currentIndex >= deck.length) {
                showResults();
                return;
            }
            cardImg.src = deck[currentIndex].url;
            progressFill.style.width = ((currentIndex / deck.length) * 100) + '%';
        }

        window.handleChoice = function(liked) {
            if (!active) return;
            
            if (liked) {
                stats.likedTotal++;
                if (deck[currentIndex].bw) stats.bwLikes++;
                stats.cats[deck[currentIndex].cat]++;
            }
            
            cardActive.style.transform = liked ? 'translateX(100px) rotate(15deg)' : 'translateX(-100px) rotate(-15deg)';
            cardActive.style.opacity = '0';

            setTimeout(() => {
                currentIndex++;
                cardActive.style.transform = 'none';
                cardActive.style.opacity = '1';
                loadCard();
            }, 180);
        };

        const descriptions = {
            viewer: {
                Arch: "You enjoy order and design. You appreciate clean lines, bold structures, and the way light plays across a building, and you find beauty in the spaces around you. Explore: Julius Shulman, Hélène Binet, Simon Kennedy, Fernando Guerra.",
                Creative: "You enjoy the imaginative stuff. You like images that are playful, surreal, or dreamlike — photos that make you stop, smile, and see the world differently. Explore: Ernst Haas, Sara Moon, Harry Callahan, Ellen Carey.",
                Human: "You enjoy people and their stories. You connect with faces, emotion, and authentic moments, and you're moved by images that make you feel something. Explore: Jane Bown, Alec Soth, Martin Parr, Boris Mikhailov.",
                Nature: "You enjoy calm and wonder. You love sweeping landscapes, close-up wildlife, and weather — images that give you a breath of fresh air and remind you of the planet. Explore: Sebastião Salgado, Eliot Porter, Tom Mangelsen, Ansel Adams.",
                Street: "You enjoy the immediacy of real life unfolding. Fleeting gestures, social tension and everyday theatre intrigue you — you like images that feel spontaneous, alive and unfiltered. Explore: Garry Winogrand, Daidō Moriyama, Bruce Gilden, Alex Webb."
            },
            photographer: {
                Arch: "Deep focus, tripod-steady and geometrically precise. You correct verticals, chase graphic lines and symmetry, and use dawn/dusk light to reveal texture and form. Explore: Julius Shulman, Hélène Binet, Simon Kennedy, Fernando Guerra.",
                Creative: "Technique is the image. You use shallow focus, intentional blur, multiple exposure and prisms, where bold colour grading and post-production are planned as part of the shot. Explore: Ernst Haas, Sara Moon, Harry Callahan, Ellen Carey.",
                Human: "Sharp on the nearest eye with soft, directional light and a flattering 85-135mm separation at f/2-f/4. You freeze fleeting expression with fast, continuous focus. Explore: Jane Bown, Alec Soth, Martin Parr, Boris Mikhailov.",
                Nature: "Two modes: f/11-f/16 on a tripod for sweeping, polarised landscapes, and long telephoto / 100mm macro at 1/1000s+ shot low and tight for wildlife and tiny detail. Explore: Sebastião Salgado, Eliot Porter, Tom Mangelsen, Ansel Adams.",
                Street: "Quick and unobtrusive on a 28/35mm, zone-focused at f/5.6-f/11 with Auto-ISO. You layer foreground and background to catch an unposed, decisive moment in available light. Explore: Garry Winogrand, Daidō Moriyama, Bruce Gilden, Alex Webb."
            }
        };

        function showResults() {
            active = false;
            renderResultsCards();
            resultsModal.style.display = 'flex';
        }

        window.setMode = function(mode) {
            currentMode = mode;
            document.getElementById('viewerTab').classList.toggle('active', mode === 'viewer');
            document.getElementById('photogTab').classList.toggle('active', mode === 'photographer');
            renderResultsCards();
        };

        function renderResultsCards() {
            const container = document.getElementById('resultsContent');
            let html = '';

            // Overall Style Card
            let bwPct = stats.likedTotal > 0 ? Math.round((stats.bwLikes / stats.likedTotal) * 100) : 0;
            let colPct = 100 - bwPct;
            html += `
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-title">Overall Style (B&W vs Color)</span>
                        <span class="stat-card-value">B&W: ${bwPct}% | Color: ${colPct}%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-bar-fill" style="width: ${bwPct}%"></div>
                    </div>
                    <div class="stat-card-desc">Your overall preference balance across monochrome and chromatic compositions.</div>
                </div>
            `;

            // Category cards (10 images per category = 10% per image)
            const catNames = {
                Creative: 'Creative',
                Nature: 'Nature',
                Street: 'Street',
                Arch: 'Architecture',
                Human: 'Human'
            };

            for (let key in catNames) {
                let count = stats.cats[key] || 0;
                let pct = count * 10;
                html += `
                    <div class="stat-card">
                        <div class="stat-card-header">
                            <span class="stat-card-title">${catNames[key]}</span>
                            <span class="stat-card-value">${count} / 10 (${pct}%)</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-bar-fill" style="width: ${pct}%"></div>
                        </div>
                        <div class="stat-card-desc">${descriptions[currentMode][key]}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        window.setFeedback = function(el) {
            document.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        };

        window.closeResults = function() {
            resultsModal.style.display = 'none';
            startBtn.style.display = 'block';
            progressContainer.style.display = 'none';
            gestureHint.style.opacity = '0.9';
            sloganEl.classList.remove('hidden');
            cardActive.style.transform = 'rotate(5deg) translateX(12px)';
            currentIndex = 0;
            cardImg.src = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80";
        };

        let startX = 0;
        cardActive.addEventListener('touchstart', e => { 
            if (!active) return;
            startX = e.touches[0].clientX; 
            cardActive.classList.add('dragging');
        });

        cardActive.addEventListener('touchend', e => {
            if (!active) return;
            cardActive.classList.remove('dragging');
            let diffX = e.changedTouches[0].clientX - startX;
            if (Math.abs(diffX) > 50) {
                window.handleChoice(diffX > 0);
            }
        });
    </script>
</body>
</html>
