<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VISUAL DNA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-header {
            position: absolute;
            top: 20px;
            text-align: center;
            z-index: 10;
        }

        .app-header h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8e8e93;
        }

        .card-container {
            position: relative;
            width: 90vw;
            max-width: 380px;
            height: 65vh;
            max-height: 580px;
            background-color: #1c1c1e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #121212;
        }

        .controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 30px;
            z-index: 10;
        }

        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.92);
        }

        .btn-dislike {
            background-color: #2c2c2e;
            color: #ff453a;
        }

        .btn-like {
            background-color: #2c2c2e;
            color: #30d158;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background-color: #0a84ff;
            width: 0%;
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

  <div class="app-header">
    <h1>Visual DNA</h1>
  </div>

  <div class="card-container">
    <div class="progress-bar" id="progressBar"></div>
    <img id="cardImg" class="card-image" src="" alt="Photo Deck">
  </div>

  <div class="controls">
    <button class="btn btn-dislike" onclick="handleSwipe(false)">✕</button>
    <button class="btn btn-like" onclick="handleSwipe(true)">♥</button>
  </div>

  <script>
    // 50-Card Deck Array matching your flat images folder filenames
    const deck = [
      // --- ARCHITECTURE ---
      { id: 1, category: 'arch', tone: 'bw', image: 'images/Arch_bw_1.jpg' },
      { id: 2, category: 'arch', tone: 'bw', image: 'images/Arch_bw_2.jpg' },
      { id: 3, category: 'arch', tone: 'bw', image: 'images/Arch_bw_3.jpg' },
      { id: 4, category: 'arch', tone: 'bw', image: 'images/Arch_bw_4.jpg' },
      { id: 5, category: 'arch', tone: 'bw', image: 'images/Arch_bw_5.jpg' },
      { id: 6, category: 'arch', tone: 'col', image: 'images/Arch_col_1.jpg' },
      { id: 7, category: 'arch', tone: 'col', image: 'images/Arch_col_2.jpg' },
      { id: 8, category: 'arch', tone: 'col', image: 'images/Arch_col_3.jpg' },
      { id: 9, category: 'arch', tone: 'col', image: 'images/Arch_col_4.jpg' },
      { id: 10, category: 'arch', tone: 'col', image: 'images/Arch_col_5.jpg' },

      // --- CREATIVE ---
      { id: 11, category: 'creative', tone: 'bw', image: 'images/Creative_bw_1.jpg' },
      { id: 12, category: 'creative', tone: 'bw', image: 'images/Creative_bw_2.jpg' },
      { id: 13, category: 'creative', tone: 'bw', image: 'images/Creative_bw_3.jpg' },
      { id: 14, category: 'creative', tone: 'bw', image: 'images/Creative_bw_4.jpg' },
      { id: 15, category: 'creative', tone: 'bw', image: 'images/Creative_bw_5.jpg' },
      { id: 16, category: 'creative', tone: 'col', image: 'images/Creative_col_1.jpg' },
      { id: 17, category: 'creative', tone: 'col', image: 'images/Creative_col_2.jpg' },
      { id: 18, category: 'creative', tone: 'col', image: 'images/Creative_col_3.jpg' },
      { id: 19, category: 'creative', tone: 'col', image: 'images/Creative_col_4.jpg' },
      { id: 20, category: 'creative', tone: 'col', image: 'images/Creative_col_5.jpg' },

      // --- HUMAN ---
      { id: 21, category: 'human', tone: 'bw', image: 'images/Human_bw_1.jpg' },
      { id: 22, category: 'human', tone: 'bw', image: 'images/Human_bw_2.jpg' },
      { id: 23, category: 'human', tone: 'bw', image: 'images/Human_bw_3.jpg' },
      { id: 24, category: 'human', tone: 'bw', image: 'images/Human_bw_4.jpg' },
      { id: 25, category: 'human', tone: 'bw', image: 'images/Human_bw_5.jpg' },
      { id: 26, category: 'human', tone: 'col', image: 'images/Human_col_1.jpg' },
      { id: 27, category: 'human', tone: 'col', image: 'images/Human_col_2.jpg' },
      { id: 28, category: 'human', tone: 'col', image: 'images/Human_col_3.jpg' },
      { id: 29, category: 'human', tone: 'col', image: 'images/Human_col_4.jpg' },
      { id: 30, category: 'human', tone: 'col', image: 'images/Human_col_5.jpg' },

      // --- NATURAL ---
      { id: 31, category: 'nat', tone: 'bw', image: 'images/Nat_bw_1.jpg' },
      { id: 32, category: 'nat', tone: 'bw', image: 'images/Nat_bw_2.jpg' },
      { id: 33, category: 'nat', tone: 'bw', image: 'images/Nat_bw_3.jpg' },
      { id: 34, category: 'nat', tone: 'bw', image: 'images/Nat_bw_4.jpg' },
      { id: 35, category: 'nat', tone: 'bw', image: 'images/Nat_bw_5.jpg' },
      { id: 36, category: 'nat', tone: 'col', image: 'images/Nat_col_1.jpg' },
      { id: 37, category: 'nat', tone: 'col', image: 'images/Nat_col_2.jpg' },
      { id: 38, category: 'nat', tone: 'col', image: 'images/Nat_col_3.jpg' },
      { id: 39, category: 'nat', tone: 'col', image: 'images/Nat_col_4.jpg' },
      { id: 40, category: 'nat', tone: 'col', image: 'images/Nat_col_5.jpg' },

      // --- STREET ---
      { id: 41, category: 'street', tone: 'bw', image: 'images/Street_bw_1.jpg' },
      { id: 42, category: 'street', tone: 'bw', image: 'images/Street_bw_2.jpg' },
      { id: 43, category: 'street', tone: 'bw', image: 'images/Street_bw_3.jpg' },
      { id: 44, category: 'street', tone: 'bw', image: 'images/Street_bw_4.jpg' },
      { id: 45, category: 'street', tone: 'bw', image: 'images/Street_bw_5.jpg' },
      { id: 46, category: 'street', tone: 'col', image: 'images/Street_col_1.jpg' },
      { id: 47, category: 'street', tone: 'col', image: 'images/Street_col_2.jpg' },
      { id: 48, category: 'street', tone: 'col', image: 'images/Street_col_3.jpg' },
      { id: 49, category: 'street', tone: 'col', image: 'images/Street_col_4.jpg' },
      { id: 50, category: 'street', tone: 'col', image: 'images/Street_col_5.jpg' }
    ];

    // Fisher-Yates deck shuffle
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let activeDeck = shuffle(deck);
    let currentIndex = 0;
    let scores = { street: 0, arch: 0, nat: 0, human: 0, creative: 0, bw: 0, col: 0 };

    const imgElement = document.getElementById('cardImg');
    const progressBar = document.getElementById('progressBar');

    function preloadNextImages(index) {
      for (let i = 1; i <= 3; i++) {
        if (index + i < activeDeck.length) {
          const img = new Image();
          img.src = activeDeck[index + i].image;
        }
      }
    }

    function renderCard() {
      if (currentIndex < activeDeck.length) {
        imgElement.src = activeDeck[currentIndex].image;
        progressBar.style.width = ((currentIndex / activeDeck.length) * 100) + '%';
        preloadNextImages(currentIndex);
      } else {
        alert('Deck Complete! Scoring Ready.');
      }
    }

    function handleSwipe(liked) {
      if (currentIndex >= activeDeck.length) return;

      const currentCard = activeDeck[currentIndex];
      if (liked) {
        scores[currentCard.category]++;
        scores[currentCard.tone]++;
      }

      currentIndex++;
      renderCard();
    }
// --- Touch / Mouse Drag Swiping ---
let isDragging = false;
let startX = 0;
let currentX = 0;
const cardElement = document.querySelector('.card') || imgElement; // Adjusts to your main image/card element

if (cardElement) {
    cardElement.style.touchAction = 'none'; // Prevents Safari from hijacking the touch gesture

    cardElement.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX;
        cardElement.setPointerCapture(e.pointerId);
    });

    cardElement.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        currentX = e.clientX - startX;
        cardElement.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
    });

    cardElement.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        cardElement.releasePointerCapture(e.pointerId);

        const threshold = 100; // Minimum pixels to trigger a swipe
        if (currentX > threshold) {
            handleSwipe(true); // Swiped right (Liked)
        } else if (currentX < -threshold) {
            handleSwipe(false); // Swiped left (Disliked)
        }

        // Reset position if not thresholded
        cardElement.style.transform = '';
        currentX = 0;
    });
}

    // Initialize first card on load
    renderCard();
  </script>
</body>
</html>
