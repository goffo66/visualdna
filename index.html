<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual DNA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f0f11;
            color: #f1f1f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }
        header {
            text-align: center;
            padding: 10px 0;
        }
        h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            font-weight: 500;
        }
        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 10px 0;
        }
        .card {
            width: 100%;
            height: 100%;
            max-height: 540px;
            background: #18181b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: absolute;
            transition: transform 0.3s ease, opacity 0.3s ease;
            cursor: grab;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex: 1;
            pointer-events: none;
        }
        .actions {
            display: flex;
            gap: 15px;
            padding: 20px 0;
            height: 90px;
        }
        button {
            flex: 1;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s;
            color: white;
            padding: 15px;
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-left {
            background: #27272a;
        }
        .btn-left:hover {
            background: #3f3f46;
        }
        .btn-right {
            background: #3b82f6;
        }
        .btn-right:hover {
            background: #2563eb;
        }
        .results {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            padding: 20px;
        }
        .results h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .results p {
            font-size: 1.1rem;
            color: #a1a1aa;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Visual DNA</h1>
        </header>
        
        <div class="card-container" id="cardContainer">
            <!-- Dynamic card injection -->
        </div>

        <div class="actions" id="actionButtons">
            <button class="btn-left" onclick="handleChoice(0)">Less of this</button>
            <button class="btn-right" onclick="handleChoice(1)">More of this</button>
        </div>
    </div>

    <script>
        const configs = [
            { cat: 'architecture', prefix: 'Arch' },
            { cat: 'creative', prefix: 'Creative' },
            { cat: 'human', prefix: 'Human' },
            { cat: 'nature', prefix: 'Nat' },
            { cat: 'street', prefix: 'Street' }
        ];

        let images = [];
        let idCounter = 1;

        configs.forEach(c => {
            for (let i = 1; i <= 5; i++) {
                images.push({
                    id: idCounter++,
                    src: `images/${c.prefix}_bw_${i}.jpg`,
                    category: c.cat,
                    tone: 'dark'
                });
            }
            for (let i = 1; i <= 5; i++) {
                images.push({
                    id: idCounter++,
                    src: `images/${c.prefix}_col_${i}.jpg`,
                    category: c.cat,
                    tone: 'light'
                });
            }
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffleArray(images);

        let currentIndex = 0;
        let scores = {
            categories: { architecture: 0, creative: 0, human: 0, nature: 0, street: 0 },
            tones: { light: 0, dark: 0 }
        };

        function initApp() {
            renderCard();
        }

        function renderCard() {
            const container = document.getElementById('cardContainer');
            if (currentIndex >= images.length) {
                showResults();
                return;
            }

            const imgData = images[currentIndex];
            container.innerHTML = `
                <div class="card" id="activeCard">
                    <img src="${imgData.src}" alt="Visual DNA sample" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'%23222\'/><text x=\'50%\' y=\'50%\' fill=\'red\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-family=\'sans-serif\' font-size=\'12\'>Missing: ${imgData.src}</text></svg>'">
                </div>
            `;

            setupSwipeHandlers();
        }

        function setupSwipeHandlers() {
            const card = document.getElementById('activeCard');
            if (!card) return;

            let startX = 0;
            let startY = 0;

            card.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            card.addEventListener('touchend', (e) => {
                let endX = e.changedTouches[0].clientX;
                let endY = e.changedTouches[0].clientY;

                let diffX = endX - startX;
                let diffY = endY - startY;

                // Ensure it's a deliberate horizontal swipe rather than a scroll
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        handleChoice(1); // Swiped Right -> More of this
                    } else {
                        handleChoice(0); // Swiped Left -> Less of this
                    }
                }
            }, { passive: true });
        }

        function handleChoice(weight) {
            if (currentIndex >= images.length) return;
            const imgData = images[currentIndex];
            
            scores.categories[imgData.category] += weight;
            scores.tones[imgData.tone] += weight;

            currentIndex++;
            renderCard();
        }

        function showResults() {
            document.getElementById('actionButtons').style.display = 'none';
            const container = document.getElementById('cardContainer');
            
            let topCat = Object.keys(scores.categories).reduce((a, b) => scores.categories[a] > scores.categories[b] ? a : b);
            let topTone = scores.tones.dark > scores.tones.light ? "High Contrast / Moody" : "Balanced / Luminous";

            container.innerHTML = `
                <div class="results" style="display: flex;">
                    <h2>Your Visual DNA</h2>
                    <p><strong>Primary Aesthetic:</strong> ${topCat.toUpperCase()}</p>
                    <p><strong>Preferred Tone:</strong> ${topTone}</p>
                    <p style="margin-top: 20px; font-size: 0.9rem; color: #71717a;">Analysis complete based on your selections.</p>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
