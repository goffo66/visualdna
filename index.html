<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAPSHOT! - Visual DNA (Build v7.0)</title>
    <style>
        :root {
            --bg-color: #08090C;
            --card-bg: #12151C;
            --text-primary: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-gold-light: #F59E0B;
            --pass-color: #EF4444;
            --like-color: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 6px;
        }

        .brand-title {
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 3px;
        }

        .brand-title .snap { color: var(--text-primary); }
        .brand-title .shot { color: var(--accent-gold-light); font-weight: 300; }

        .version-tag {
            font-size: 0.5rem;
            color: var(--accent-gold-light);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 3px;
            opacity: 0.8;
        }

        .pill-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 50px;
            padding: 3px 12px;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 3px;
            backdrop-filter: blur(10px);
        }

        .pill-badge span { color: var(--accent-gold-light); font-style: italic; }

        .slogan {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.1;
            color: var(--text-primary);
            transition: opacity 0.3s ease;
        }

        .slogan .action {
            font-style: italic;
            color: var(--accent-gold-light);
            display: block;
            font-size: 1.1rem;
        }

        .progress-bar-container {
            width: 160px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 6px;
            display: none;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gold-light);
            transition: width 0.2s ease;
        }

        .stage-container {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .card-stack {
            position: relative;
            width: 180px;
            height: 250px;
            touch-action: none;
        }

        .card-frame {
            position: absolute;
            inset: 0;
            background: var(--card-bg);
            border-radius: 16px;
            border: 3px solid #1E222D;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        }

        .card-static {
            z-index: 1;
            transform: scale(0.96);
            border-color: #171a22;
            opacity: 0.85;
        }

        .card-active {
            z-index: 2;
            transform: rotate(5deg) translateX(12px);
            cursor: grab;
        }

        .card-active.dragging {
            box-shadow: 0 16px 35px rgba(0,0,0,0.9);
            cursor: grabbing;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
        }

        .gesture-hint {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 150px;
            height: 150px;
            opacity: 0.9;
            z-index: 3;
            transition: opacity 0.3s ease;
            pointer-events: none;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.85));
        }

        .gesture-hint svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
            gap: 10px;
            margin-bottom: 10px;
        }

        .button-row {
            display: flex;
            gap: 20px;
        }

        .action-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            opacity: 0.85;
        }

        .btn-pass { background-color: var(--pass-color); color: white; }
        .btn-like { background-color: var(--like-color); color: white; }

        .action-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sub-instruction { 
            font-size: 0.65rem; 
            color: var(--text-muted); 
        }
        .sub-instruction strong { color: var(--text-primary); }

        .primary-start-btn {
            background-color: var(--like-color);
            color: #FFFFFF;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 12px 32px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            margin-top: 4px;
        }

        .footer-link {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.7;
        }

        .results-modal {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .results-card {
            background: var(--card-bg);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
        }

        .results-title {
            color: var(--accent-gold-light);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .results-stat {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .restart-btn {
            margin-top: 20px;
            background: var(--like-color);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="brand-title"><span class="snap">SNAP</span><span class="shot">SHOT!</span></h1>
        <div class="version-tag">Build v7.0</div>
        <div class="pill-badge">YOUR <strong>VISUAL DNA</strong> IN <span>60 SECONDS!</span></div>
        <div class="slogan" id="sloganEl">
            IF YOU FEEL IT,
            <span class="action">SWIPE IT!</span>
        </div>
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="stage-container">
        <div class="gesture-hint" id="gestureHint">
            <svg viewBox="0 0 120 120">
                <path d="M 15,95 C 30,35 80,30 105,50" />
                <path d="M 92,38 L 107,52 L 90,62" />
            </svg>
        </div>

        <div class="card-stack">
            <!-- Static Background Card -->
            <div class="card-frame card-static">
                <img class="card-image" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="Stacked Teaser">
            </div>

            <!-- Active Foreground Card -->
            <div class="card-frame card-active" id="cardActive">
                <img class="card-image" id="cardImg" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="Visual Teaser">
            </div>
        </div>
    </div>

    <div class="controls-container">
        <div class="button-row" id="buttonRow">
            <button class="action-btn btn-pass" id="btnPass" onclick="window.handleChoice(false)" aria-label="Skip">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <button class="action-btn btn-like" id="btnLike" onclick="window.handleChoice(true)" aria-label="Like">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
        </div>
        <div class="sub-instruction" id="subInstruction">or use <strong>buttons</strong></div>

        <button class="primary-start-btn" id="startBtn" onclick="window.triggerStartTest()">START TEST</button>
    </div>

    <div class="footer-link">How we protect your test data</div>

    <div class="results-modal" id="resultsModal">
        <div class="results-card">
            <div class="results-title">Your Visual DNA</div>
            <div class="results-stat"><span>Primary Style:</span> <strong id="resStyle">High Contrast</strong></div>
            <div class="results-stat"><span>Monochrome Ratio:</span> <strong id="resBw">0% B&W</strong></div>
            <div class="results-stat"><span>Liked Images:</span> <strong id="resCount">0 / 50</strong></div>
            <button class="restart-btn" id="restartBtn" onclick="window.restartTest()">TEST AGAIN</button>
        </div>
    </div>

    <script>
        // Full 50-image curated deck with balanced monochrome and high-contrast styling flags
        const deck = [
            { url: "https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1426604966848-d7adac902bff?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1483347756197-71ef80e95f73?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1500622944204-b135684e99fd?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1505765050516-f72dcac9c60e?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1510784722466-f2aa9c52fff6?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1433086966358-54859ef0ed71?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1526379095098-d400fd0bf935?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1498758536662-35b82cd15e29?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=600&q=80", bw: false }
        ];

        let currentIndex = 0;
        let likedCount = 0;
        let bwLikes = 0;
        let active = false;

        const cardActive = document.getElementById('cardActive');
        const cardImg = document.getElementById('cardImg');
        const startBtn = document.getElementById('startBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const sloganEl = document.getElementById('sloganEl');
        const resultsModal = document.getElementById('resultsModal');
        const gestureHint = document.getElementById('gestureHint');

        window.triggerStartTest = function() {
            startBtn.style.display = 'none';
            sloganEl.classList.add('hidden');
            gestureHint.style.opacity = '0';

            cardActive.style.transform = 'none';
            progressContainer.style.display = 'block';

            currentIndex = 0;
            likedCount = 0;
            bwLikes = 0;
            active = true;
            loadCard();
        };

        function loadCard() {
            if (currentIndex >= deck.length) {
                showResults();
                return;
            }
            cardImg.src = deck[currentIndex].url;
            progressFill.style.width = ((currentIndex / deck.length) * 100) + '%';
        }

        window.handleChoice = function(liked) {
            if (!active) return;
            
            if (liked) {
                likedCount++;
                if (deck[currentIndex].bw) bwLikes++;
            }
            
            cardActive.style.transform = liked ? 'translateX(100px) rotate(15deg)' : 'translateX(-100px) rotate(-15deg)';
            cardActive.style.opacity = '0';

            setTimeout(() => {
                currentIndex++;
                cardActive.style.transform = 'none';
                cardActive.style.opacity = '1';
                loadCard();
            }, 180);
        };

        function showResults() {
            active = false;
            document.getElementById('resCount').textContent = `${likedCount} / ${deck.length}`;
            let bwPercentage = Math.round((bwLikes / (likedCount || 1)) * 100);
            document.getElementById('resBw').textContent = `${bwPercentage}% B&W`;
            document.getElementById('resStyle').textContent = bwPercentage > 50 ? 'Monochrome Noir' : 'High Contrast';
            resultsModal.style.display = 'flex';
        }

        window.restartTest = function() {
            resultsModal.style.display = 'none';
            startBtn.style.display = 'block';
            progressContainer.style.display = 'none';
            gestureHint.style.opacity = '0.9';
            sloganEl.classList.remove('hidden');
            
            cardActive.style.transform = 'rotate(5deg) translateX(12px)';
            
            currentIndex = 0;
            cardImg.src = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80";
        };

        let startX = 0;
        cardActive.addEventListener('touchstart', e => { 
            if (!active) return;
            startX = e.touches[0].clientX; 
            cardActive.classList.add('dragging');
        });

        cardActive.addEventListener('touchend', e => {
            if (!active) return;
            cardActive.classList.remove('dragging');
            let diffX = e.changedTouches[0].clientX - startX;
            if (Math.abs(diffX) > 50) {
                window.handleChoice(diffX > 0);
            }
        });
    </script>
</body>
</html>
