<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAPSHOT! - Visual DNA</title>
    <style>
        :root {
            --bg-color: #08090C;
            --card-bg: #12151C;
            --text-primary: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-gold-light: #F59E0B;
            --pass-color: #EF4444;
            --like-color: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 16px;
            overflow: hidden;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-top: 5px;
        }

        .brand-title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 10px;
        }

        .brand-title .snap { color: var(--text-primary); }
        .brand-title .shot { color: var(--accent-gold-light); font-weight: 300; }

        .pill-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 50px;
            padding: 6px 18px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }

        .pill-badge span { color: var(--accent-gold-light); font-style: italic; }

        .slogan {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.2;
            color: var(--text-primary);
        }

        .slogan .action {
            font-style: italic;
            color: var(--accent-gold-light);
            display: block;
            font-size: 1.35rem;
        }

        .progress-bar-container {
            width: 240px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 8px;
            display: none;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gold-light);
            transition: width 0.2s ease;
        }

        .stage-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        .swipe-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            z-index: 1;
        }

        .swipe-label.left { left: -5px; }
        .swipe-label.right { right: -5px; }

        .swipe-label .arrow {
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .card-frame {
            width: 240px;
            height: 350px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 4px solid #1E222D;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            position: relative;
            z-index: 2;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
            min-height: 85px;
            justify-content: center;
        }

        .primary-start-btn {
            background-color: var(--like-color);
            color: #FFFFFF;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 16px 42px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
        }

        .button-row {
            display: none;
            gap: 28px;
            margin-bottom: 6px;
        }

        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-pass { background-color: var(--pass-color); color: white; }
        .btn-like { background-color: var(--like-color); color: white; }

        .action-btn svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sub-instruction { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            margin-top: 4px;
            display: none;
        }
        .sub-instruction strong { color: var(--text-primary); }

        .results-modal {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .results-card {
            background: var(--card-bg);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
        }

        .results-title {
            color: var(--accent-gold-light);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .results-stat {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        .restart-btn {
            margin-top: 20px;
            background: var(--like-color);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .footer-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            margin-top: 8px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="brand-title"><span class="snap">SNAP</span><span class="shot">SHOT!</span></h1>
        <div class="pill-badge">YOUR <strong>VISUAL DNA</strong> IN <span>60 SECONDS!</span></div>
        <div class="slogan">
            IF YOU FEEL IT,
            <span class="action">SWIPE IT!</span>
        </div>
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="stage-container">
        <div class="swipe-label left">
            <span class="arrow">&larr;</span>
            <span>Skip</span>
        </div>

        <div class="card-frame" id="cardFrame">
            <img class="card-image" id="cardImg" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Test Photo">
        </div>

        <div class="swipe-label right">
            <span class="arrow">&rarr;</span>
            <span>Like it</span>
        </div>
    </div>

    <div class="controls-container">
        <button class="primary-start-btn" id="startBtn">START TEST</button>

        <div class="button-row" id="buttonRow">
            <button class="action-btn btn-pass" id="btnPass" aria-label="Skip">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <button class="action-btn btn-like" id="btnLike" aria-label="Like">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
        </div>
        <div class="sub-instruction" id="subInstruction">or use <strong>buttons</strong></div>
    </div>

    <div class="footer-link">How we protect your test data</div>

    <div class="results-modal" id="resultsModal">
        <div class="results-card">
            <div class="results-title">Your Visual DNA</div>
            <div class="results-stat"><span>Primary Style:</span> <strong>High Contrast</strong></div>
            <div class="results-stat"><span>Monochrome Ratio:</span> <strong id="resBw">64% B&W</strong></div>
            <div class="results-stat"><span>Liked Images:</span> <strong id="resCount">0 / 6</strong></div>
            <button class="restart-btn" id="restartBtn">TEST AGAIN</button>
        </div>
    </div>

    <script>
        const deck = [
            { url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80", bw: true },
            { url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80", bw: false },
            { url: "https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=600&q=80", bw: true }
        ];

        let currentIndex = 0;
        let likedCount = 0;
        let bwLikes = 0;

        const cardFrame = document.getElementById('cardFrame');
        const cardImg = document.getElementById('cardImg');
        const startBtn = document.getElementById('startBtn');
        const buttonRow = document.getElementById('buttonRow');
        const subInstruction = document.getElementById('subInstruction');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const resultsModal = document.getElementById('resultsModal');

        function startTest() {
            startBtn.style.display = 'none';
            buttonRow.style.display = 'flex';
            subInstruction.style.display = 'block';
            progressContainer.style.display = 'block';
            loadCard();
        }

        function loadCard() {
            if (currentIndex >= deck.length) {
                showResults();
                return;
            }
            cardImg.src = deck[currentIndex].url;
            progressFill.style.width = ((currentIndex / deck.length) * 100) + '%';
        }

        function handleChoice(liked) {
            if (liked) {
                likedCount++;
                if (deck[currentIndex].bw) bwLikes++;
            }
            
            cardFrame.style.transform = liked ? 'translateX(120px) rotate(15deg)' : 'translateX(-120px) rotate(-15deg)';
            cardFrame.style.opacity = '0';

            setTimeout(() => {
                currentIndex++;
                cardFrame.style.transform = 'none';
                cardFrame.style.opacity = '1';
                loadCard();
            }, 180);
        }

        function showResults() {
            document.getElementById('resCount').textContent = `${likedCount} / ${deck.length}`;
            document.getElementById('resBw').textContent = `${Math.round((bwLikes / (likedCount || 1)) * 100)}% B&W`;
            resultsModal.style.display = 'flex';
        }

        startBtn.onclick = startTest;
        document.getElementById('btnPass').onclick = () => handleChoice(false);
        document.getElementById('btnLike').onclick = () => handleChoice(true);
        document.getElementById('restartBtn').onclick = () => {
            currentIndex = 0;
            likedCount = 0;
            bwLikes = 0;
            resultsModal.style.display = 'none';
            startBtn.style.display = 'block';
            buttonRow.style.display = 'none';
            subInstruction.style.display = 'none';
            progressContainer.style.display = 'none';
            cardImg.src = deck[0].url;
        };
    </script>
</body>
</html>
