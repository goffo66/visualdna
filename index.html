<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual DNA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background-color: #0f0f11;
            color: #f1f1f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 15px 20px;
            justify-content: space-between;
        }
        header {
            text-align: center;
            padding: 5px 0;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            font-weight: 500;
        }
        .top-progress-bar {
            width: 100%;
            height: 3px;
            background: #27272a;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .top-progress-fill {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 0.8rem;
            color: #52525b;
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 10px 0;
            overflow: hidden;
        }
        .card {
            width: 100%;
            height: 100%;
            max-height: 520px;
            background: #18181b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
            transform: translate3d(0, 0, 0);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
        .actions {
            display: flex;
            gap: 20px;
            padding: 10px 0;
            height: 90px;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background 0.2s;
            background: #18181b;
        }
        .icon-btn:active {
            transform: scale(0.90);
        }
        .btn-left {
            border: 2px solid #3f3f46;
        }
        .btn-left:hover {
            background: #27272a;
            border-color: #ef4444;
        }
        .btn-left svg {
            fill: #ef4444;
            width: 26px;
            height: 26px;
        }
        .btn-right {
            border: 2px solid #3f3f46;
        }
        .btn-right:hover {
            background: #27272a;
            border-color: #10b981;
        }
        .btn-right svg {
            fill: #10b981;
            width: 28px;
            height: 28px;
        }
        .results {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            height: 100%;
            padding: 10px 0;
            overflow-y: auto;
            width: 100%;
        }
        .results h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .graph-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
            text-align: left;
            padding-bottom: 10px;
        }
        .graph-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .graph-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #d4d4d8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bar-background {
            width: 100%;
            height: 12px;
            background: #27272a;
            border-radius: 6px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: #10b981;
            border-radius: 6px;
            transition: width 0.5s ease;
        }
        .restart-btn {
            margin: 20px 0 30px 0;
            background: #27272a;
            color: #f1f1f3;
            border: 1px solid #3f3f46;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, border-color 0.2s;
        }
        .restart-btn:hover {
            background: #3f3f46;
            border-color: #52525b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header id="appHeader">
            <h1>Visual DNA</h1>
            <div class="top-progress-bar">
                <div class="top-progress-fill" id="topProgressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Image 1 of 50</div>
        </header>
        
        <div class="card-container" id="cardContainer">
            <!-- Dynamic card injection -->
        </div>

        <div class="actions" id="actionButtons">
            <!-- Cross / Pass (Neutral 0) -->
            <button class="icon-btn btn-left" onclick="handleChoice(0)" title="Pass">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <!-- Heart / Like (+1) -->
            <button class="icon-btn btn-right" onclick="handleChoice(1)" title="More of this">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const configs = [
            { cat: 'architecture', prefix: 'Arch' },
            { cat: 'creative', prefix: 'Creative' },
            { cat: 'human', prefix: 'Human' },
            { cat: 'nature', prefix: 'Nat' },
            { cat: 'street', prefix: 'Street' }
        ];

        let images = [];
        let idCounter = 1;

        configs.forEach(c => {
            for (let i = 1; i <= 5; i++) {
                images.push({ id: idCounter++, src: `images/${c.prefix}_bw_${i}.jpg`, category: c.cat });
            }
            for (let i = 1; i <= 5; i++) {
                images.push({ id: idCounter++, src: `images/${c.prefix}_col_${i}.jpg`, category: c.cat });
            }
        });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffleArray(images);

        let currentIndex = 0;
        let scores = { architecture: 0, creative: 0, human: 0, nature: 0, street: 0 };
        let categoryCounts = { architecture: 0, creative: 0, human: 0, nature: 0, street: 0 };

        images.forEach(img => { categoryCounts[img.category]++; });

        function initApp() {
            renderCard();
        }

        function renderCard() {
            const container = document.getElementById('cardContainer');
            const progressEl = document.getElementById('progressText');
            const topFill = document.getElementById('topProgressFill');
            
            if (currentIndex >= images.length) {
                document.getElementById('appHeader').style.display = 'none';
                showResults();
                return;
            }

            const currentNum = currentIndex + 1;
            const totalNum = images.length;
            progressEl.textContent = `Image ${currentNum} of ${totalNum}`;
            topFill.style.width = `${(currentNum / totalNum) * 100}%`;

            const imgData = images[currentIndex];
            container.innerHTML = `
                <div class="card" id="activeCard">
                    <img src="${imgData.src}" alt="Visual DNA sample" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'%23222\'/><text x=\'50%\' y=\'50%\' fill=\'red\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-family=\'sans-serif\' font-size=\'12\'>Missing: ${imgData.src}</text></svg>'">
                </div>
            `;

            setupSwipeHandlers();
        }

        function setupSwipeHandlers() {
            const card = document.getElementById('activeCard');
            if (!card) return;

            let startX = 0;
            let startY = 0;

            card.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            card.addEventListener('touchend', (e) => {
                let endX = e.changedTouches[0].clientX;
                let endY = e.changedTouches[0].clientY;

                let diffX = endX - startX;
                let diffY = endY - startY;

                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                    if (diffX > 0) {
                        handleChoice(1);  // Swipe Right -> Like (+1)
                    } else {
                        handleChoice(0);  // Swipe Left -> Neutral Pass (0)
                    }
                }
            }, { passive: true });
        }

        function handleChoice(weight) {
            if (currentIndex >= images.length) return;
            const imgData = images[currentIndex];
            
            scores[imgData.category] += weight;

            currentIndex++;
            renderCard();
        }

        function showResults() {
            document.getElementById('actionButtons').style.display = 'none';
            const container = document.getElementById('cardContainer');
            
            let graphHTML = '';
            let sortedCategories = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);

            sortedCategories.forEach(cat => {
                let totalAvailable = categoryCounts[cat];
                let likes = scores[cat];
                let percentage = totalAvailable > 0 ? Math.round((likes / totalAvailable) * 100) : 0;

                graphHTML += `
                    <div class="graph-item">
                        <div class="graph-label">
                            <span>${cat}</span>
                            <span>${likes} / ${totalAvailable} (${percentage}%)</span>
                        </div>
                        <div class="bar-background">
                            <div class="bar-fill" style="width: ${percentage}%;"></div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="results" style="display: flex;">
                    <h2>Your Visual DNA Profile</h2>
                    <div class="graph-container">
                        ${graphHTML}
                    </div>
                    <button class="restart-btn" onclick="restartQuiz()">Take Test Again</button>
                </div>
            `;
        }

        function restartQuiz() {
            currentIndex = 0;
            scores = { architecture: 0, creative: 0, human: 0, nature: 0, street: 0 };
            shuffleArray(images);
            document.getElementById('appHeader').style.display = 'block';
            document.getElementById('actionButtons').style.display = 'flex';
            renderCard();
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
