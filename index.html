<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual DNA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            background-color: #0f0f11 !important;
            color: #f1f1f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 15px 20px;
            justify-content: space-between;
        }
        header { text-align: center; padding: 5px 0; flex-shrink: 0; }
        h1 { font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; color: #888; font-weight: 500; }
        .top-progress-bar { width: 100%; height: 3px; background: #27272a; border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .top-progress-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 0.3s ease; }
        .progress-text { font-size: 0.8rem; color: #52525b; margin-top: 6px; letter-spacing: 1px; }
        .card-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; width: 100%; margin: 10px 0; overflow: hidden; }
        .card {
            position: absolute; top: 0; bottom: 0; left: 0; right: 0; margin: auto;
            width: 100%; height: 100%; max-height: 520px; aspect-ratio: 9 / 16;
            background: #18181b; border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column;
            cursor: grab; user-select: none; transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .card:active { cursor: grabbing; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .card-fallback { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1e1e24; color: #a1a1aa; padding: 20px; text-align: center; gap: 10px; }
        .card-fallback span { font-size: 1.1rem; font-weight: 600; color: #f1f1f3; letter-spacing: 1px; text-transform: uppercase; }
        .card-fallback p { font-size: 0.8rem; color: #71717a; word-break: break-all; }
        .actions { display: flex; gap: 20px; padding: 10px 0; height: 90px; justify-content: center; align-items: center; flex-shrink: 0; }
        .icon-btn { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #3f3f46; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.3); background: #18181b; touch-action: manipulation; }
        .icon-btn:active { transform: scale(0.90); }
        .icon-btn svg { width: 26px; height: 26px; pointer-events: none; }
        .btn-left svg { fill: #ef4444; }
        .btn-right svg { fill: #10b981; }
        .results { display: none; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; height: 100%; padding: 24px 0 30px 0; overflow-y: auto; width: 100%; }
        .results h2 { font-size: 1.2rem; margin-bottom: 8px; letter-spacing: 1.5px; text-transform: uppercase; }
        .subtitle-heading { font-size: 0.8rem; color: #10b981; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; margin-bottom: 14px; }
        .toggle-container { display: flex; background: #27272a; border-radius: 25px; padding: 4px; margin-bottom: 18px; width: 100%; max-width: 320px; }
        .toggle-btn { flex: 1; background: transparent; border: none; color: #a1a1aa; padding: 9px 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border-radius: 20px; cursor: pointer; }
        .toggle-btn.active { background: #3b82f6; color: #f1f1f3; }
        .graph-container { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-top: 5px; text-align: left; padding-bottom: 10px; }
        .graph-item { display: flex; flex-direction: column; gap: 6px; background: #18181b; padding: 12px; border-radius: 12px; border: 1px solid #27272a; }
        .graph-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #f1f1f3; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .graph-stats { font-size: 0.75rem; color: #71717a; font-weight: normal; }
        .bar-background { width: 100%; height: 10px; background: #27272a; border-radius: 5px; overflow: hidden; margin-top: 2px; }
        .bar-fill { height: 100%; background: #10b981; border-radius: 5px; }
        .category-desc { font-size: 0.8rem; color: #a1a1aa; line-height: 1.4; margin-top: 4px; }
        .splash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0f0f11; display: flex; justify-content: center; align-items: center; z-index: 9999; overflow-y: auto; padding: 12px 15px; }
        .splash-content { max-width: 360px; width: 100%; text-align: center; color: #ffffff; display: flex; flex-direction: column; gap: 12px; margin: auto; }
        .splash-content h1 { font-size: 22px; font-weight: 800; letter-spacing: 2px; margin: 0; }
        .splash-content h2 { font-size: 14px; font-weight: 400; color: #aaaaaa; margin-top: -4px; margin-bottom: 2px; }
        .visual-guide-card { background-color: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 12px; }
        .guide-image-container { width: 100%; max-width: 220px; border-radius: 8px; overflow: hidden; background: #111115; margin: 0 auto; }
        .guide-image-container img { width: 100%; height: auto; display: block; }
        .splash-instructions { font-size: 12px; color: #cccccc; line-height: 1.35; }
        .start-btn { background-color: #10b981 !important; color: #ffffff !important; border: none !important; border-radius: 14px !important; padding: 14px !important; font-size: 16px !important; font-weight: 700 !important; cursor: pointer !important; width: 100% !important; letter-spacing: 1px !important; }

        .completion-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .feedback-section {
            margin: 2rem 0;
        }
        .feedback-prompt {
            font-size: 0.95rem;
            margin-bottom: 1rem;
            color: #555;
        }
        .smiley-row {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .smiley-btn {
            background: transparent;
            border: 2px solid #ddd;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .smiley-btn:hover {
            border-color: #333;
            transform: scale(1.08);
        }
        .smiley-btn.selected {
            border-color: #000;
            background-color: #f0f0f0;
            transform: scale(1.1);
        }
        .final-message {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #777;
        }
    </style>
</head>
<body>

<div id="splash-screen" class="splash-overlay">
  <div class="splash-content">
    <h1>VISUAL DNA</h1>
    <h2>in 60 seconds</h2>
    <div class="visual-guide-card">
      <div class="guide-image-container">
        <img src="images/guide.jpg" alt="Visual DNA Guide" onerror="this.style.display='none';">
      </div>
    </div>
    <p class="splash-instructions">
      Take about 60 seconds. Go with your first instinct — swipe left to pass, swipe right if it resonates.
    </p>
<p class="privacy-note" style="font-size: 0.75rem; color: #888888; margin: 8px 0;">Anonymous telemetry securely logged (standard network connection logs apply).</p>
 <button id="start-test-btn" class="start-btn" onclick="startQuizDirectly()">START TEST</button>
  </div>
</div>

<div class="container">
    <header id="appHeader">
        <h1>Visual DNA</h1>
        <div class="top-progress-bar">
            <div class="top-progress-fill" id="topProgressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Image 1 of 50</div>
    </header>
    
    <div class="card-container" id="cardContainer"></div>

    <div class="actions" id="actionButtons">
        <button class="icon-btn btn-left" onclick="handleChoiceAnimation(0)" title="Pass">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <button class="icon-btn btn-right" onclick="handleChoiceAnimation(1)" title="More of this">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
    </div>
</div>

<script>
    const configs = [
        { cat: 'architecture', prefix: 'Arch', name: 'Architecture' },
        { cat: 'creative', prefix: 'Creative', name: 'Creative' },
        { cat: 'human', prefix: 'Human', name: 'Human' },
        { cat: 'nature', prefix: 'Nat', name: 'Nature' },
        { cat: 'street', prefix: 'Street', name: 'Street' }
    ];

    const insights = {
        maker: {
            architecture: "Deep focus, tripod-steady and geometrically precise. You correct verticals, chase graphic lines and symmetry, and use dawn/dusk light to reveal texture and form.",
            creative: "Technique is the image. You use shallow focus, intentional blur, multiple exposure and prisms, where bold colour grading and post-production are planned as part of the shot.",
            human: "Sharp on the nearest eye with soft, directional light and a flattering separation at f/2-f/4. You freeze fleeting expression with fast, continuous focus.",
            nature: "Two modes: tripod-steady sweeping landscapes, and long telephoto shot low and tight for wildlife and tiny detail.",
            street: "Quick and unobtrusive on a 28/35mm, zone-focused with Auto-ISO. You layer foreground and background to catch an unposed, decisive moment."
        },
        viewer: {
            architecture: "You enjoy order and design. You appreciate clean lines, bold structures, and the way light plays across a building.",
            creative: "You enjoy the imaginative stuff. You like images that are playful, surreal, or dreamlike — photos that make you stop and smile.",
            human: "You enjoy people and their stories. You connect with faces, emotion, and authentic moments.",
            nature: "You enjoy calm and wonder. You love sweeping landscapes, close-up wildlife, and weather.",
            street: "You enjoy the immediacy of real life unfolding. Fleeting gestures and everyday theatre intrigue you."
        }
    };

    let images = [];
    let idCounter = 1;

    configs.forEach(c => {
        for (let i = 1; i <= 5; i++) {
            images.push({ id: idCounter++, src: `images/${c.prefix}_bw_${i}.jpg`, category: c.cat, label: `${c.name} B&W #${i}` });
        }
        for (let i = 1; i <= 5; i++) {
            images.push({ id: idCounter++, src: `images/${c.prefix}_col_${i}.jpg`, category: c.cat, label: `${c.name} Colour #${i}` });
        }
    });

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    shuffleArray(images);

    let currentIndex = 0;
    let scores = { architecture: 0, creative: 0, human: 0, nature: 0, street: 0 };
    let categoryCounts = { architecture: 0, creative: 0, human: 0, nature: 0, street: 0 };
    let styleScores = { 
        global: { bw: 0, col: 0 }, 
        architecture: { bw: 0, col: 0 }, 
        creative: { bw: 0, col: 0 }, 
        human: { bw: 0, col: 0 }, 
        nature: { bw: 0, col: 0 }, 
        street: { bw: 0, col: 0 } 
    };
    let currentPerspective = 'viewer';

    images.forEach(img => { categoryCounts[img.category]++; });

    function startQuizDirectly() {
        const splashScreen = document.getElementById('splash-screen');
        if (splashScreen) {
            splashScreen.style.display = 'none';
        }
        renderCard();
    }

    function renderCard() {
        const container = document.getElementById('cardContainer');
        const progressEl = document.getElementById('progressText');
        const topFill = document.getElementById('topProgressFill');
        
        if (currentIndex >= images.length) {
            document.getElementById('appHeader').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'none';
            showResults();
            return;
        }

        const currentNum = currentIndex + 1;
        const totalNum = images.length;
        progressEl.textContent = `Image ${currentNum} of ${totalNum}`;
        topFill.style.width = `${(currentNum / totalNum) * 100}%`;

        const imgData = images[currentIndex];
        container.innerHTML = `
            <div class="card" id="activeCard">
                <img src="${imgData.src}" alt="${imgData.label}" onerror="this.parentElement.innerHTML='<div class=\'card-fallback\'><span>${imgData.label}</span><p>${imgData.src}</p></div>'">
            </div>
        `;

        initCardSwipe();
    }

    function initCardSwipe() {
        const card = document.getElementById('activeCard');
        if (!card) return;

        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        function onTouchStart(e) {
            isDragging = true;
            startX = e.touches ? e.touches[0].clientX : e.clientX;
            card.style.transition = 'none';
        }

        function onTouchMove(e) {
            if (!isDragging) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            currentX = x - startX;
            const rotation = currentX * 0.05;
            card.style.transform = `translate(${currentX}px, 0px) rotate(${rotation}deg)`;
        }

        function onTouchEnd() {
            if (!isDragging) return;
            isDragging = false;
            card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';

            if (currentX > 100) {
                card.style.transform = `translate(500px, 0px) rotate(30deg)`;
                card.style.opacity = '0';
                setTimeout(() => handleChoice(1), 200);
            } else if (currentX < -100) {
                card.style.transform = `translate(-500px, 0px) rotate(-30deg)`;
                card.style.opacity = '0';
                setTimeout(() => handleChoice(0), 200);
            } else {
                card.style.transform = 'translate(0px, 0px) rotate(0deg)';
            }
            currentX = 0;
        }

        card.addEventListener('touchstart', onTouchStart, { passive: true });
        card.addEventListener('touchmove', onTouchMove, { passive: true });
        card.addEventListener('touchend', onTouchEnd);

        card.addEventListener('mousedown', onTouchStart);
        window.addEventListener('mousemove', onTouchMove);
        window.addEventListener('mouseup', onTouchEnd);
    }

    function handleChoiceAnimation(weight) {
        const card = document.getElementById('activeCard');
        if (!card) {
            handleChoice(weight);
            return;
        }

        card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        const dir = weight > 0 ? 500 : -500;
        const rot = weight > 0 ? 30 : -30;
        card.style.transform = `translate(${dir}px, 0px) rotate(${rot}deg)`;
        card.style.opacity = '0';

        setTimeout(() => {
            handleChoice(weight);
        }, 200);
    }

    function handleChoice(weight) {
        if (currentIndex >= images.length) return;
        const imgData = images[currentIndex];
        scores[imgData.category] += weight;

        if (weight > 0) {
            if (imgData.src.includes('_bw_')) styleScores.global.bw++;
            else if (imgData.src.includes('_col_')) styleScores.global.col++;
        }

        currentIndex++;
        renderCard();
    }

    function setPerspective(perspective) {
        currentPerspective = perspective;
        document.getElementById('btnViewer').classList.toggle('active', perspective === 'viewer');
        document.getElementById('btnMaker').classList.toggle('active', perspective === 'maker');
        document.getElementById('graphContainer').innerHTML = generateGraphHTML();
    }

    function generateGraphHTML() {
        let html = '';
        let totalBwLiked = styleScores.global.bw;
        let totalColLiked = styleScores.global.col;
        let totalStyleLiked = totalBwLiked + totalColLiked;
        let bwPercent = totalStyleLiked > 0 ? Math.round((totalBwLiked / totalStyleLiked) * 100) : 0;
        let colPercent = totalStyleLiked > 0 ? (100 - bwPercent) : 0;

        let telemetryData = { bwPercent, colPercent };
        Object.keys(scores).forEach(cat => {
            let totalAvailable = categoryCounts[cat];
            let likes = scores[cat];
            telemetryData[cat + '_likes'] = likes;
            telemetryData[cat + '_percent'] = totalAvailable > 0 ? Math.round((likes / totalAvailable) * 100) : 0;
        });

        try {
            fetch("https://usebasin.com/f/9192c6e4727d", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Accept": "application/json" },
                body: JSON.stringify(telemetryData)
            }).catch(() => {});
        } catch (e) {}

        html += `
            <div class="graph-item">
                <div class="graph-label">
                    <span>Overall Style (B&W vs Colour)</span>
                    <span class="graph-stats">B&W: ${bwPercent}% | Colour: ${colPercent}%</span>
                </div>
                <div class="bar-background" style="display: flex;">
                    <div class="bar-fill" style="width: ${bwPercent}%; background: #a1a1aa; border-radius: 5px 0 0 5px;"></div>
                    <div class="bar-fill" style="width: ${colPercent}%; background: #3b82f6; border-radius: 0 5px 5px 0;"></div>
                </div>
            </div>
        `;

        Object.keys(scores).sort((a, b) => scores[b] - scores[a]).forEach(cat => {
            let totalAvailable = categoryCounts[cat];
            let likes = scores[cat];
            let percentage = totalAvailable > 0 ? Math.round((likes / totalAvailable) * 100) : 0;
            let catConfig = configs.find(c => c.cat === cat);
            
            html += `
                <div class="graph-item">
                    <div class="graph-label">
                        <span>${catConfig ? catConfig.name : cat}</span>
                        <span class="graph-stats">${likes} / ${totalAvailable} (${percentage}%)</span>
                    </div>
                    <div class="bar-background">
                        <div class="bar-fill" style="width: ${percentage}%;"></div>
                    </div>
                    <div class="category-desc">${insights[currentPerspective][cat]}</div>
                </div>
            `;
        });
        return html;
    }

    function showResults() {
        document.getElementById('cardContainer').innerHTML = `
            <div class="results" style="display: flex;">
                <h2>YOUR VISUAL DNA PROFILE</h2>
                <div class="subtitle-heading">WHAT IT MEANS FOR YOU...</div>
                
                <div class="toggle-container">
                    <button class="toggle-btn active" id="btnViewer" onclick="setPerspective('viewer')">AS A VIEWER</button>
                    <button class="toggle-btn" id="btnMaker" onclick="setPerspective('maker')">AS A PHOTOGRAPHER</button>
                </div>

                <div class="graph-container" id="graphContainer">
                    ${generateGraphHTML()}
                </div>

<div id="end-screen" class="screen" style="display: none;">
    <h2>Test Complete</h2>
    <p>How did you find the experience?</p>
    
    <div class="rating-options" style="display: flex; justify-content: center; gap: 20px; font-size: 2.5rem; margin: 20px 0;">
        <button class="rating-btn" data-rating="Didn't like it" style="background:none; border:none; cursor:pointer;">🙁</button>
        <button class="rating-btn" data-rating="It was okay" style="background:none; border:none; cursor:pointer;">😐</button>
        <button class="rating-btn" data-rating="Really liked it" style="background:none; border:none; cursor:pointer;">😊</button>
    </div>
    
    <!-- Graceful exit / finish button to solve the dead-end issue -->
    <button id="exit-btn" class="primary-btn" style="margin-top: 20px;">Finish & Close</button>
</div>
        </div>

// 1. Track the selected rating
let selectedRating = "Not provided";

// 2. Attach listeners to the new 3-option rating buttons
document.querySelectorAll('.rating-btn').forEach(button => {
    button.addEventListener('click', (e) => {
        // Reset scale on all buttons, then enlarge the clicked one for visual feedback
        document.querySelectorAll('.rating-btn').forEach(btn => btn.style.transform = 'scale(1)');
        e.currentTarget.style.transform = 'scale(1.2)';
        
        // Capture the rating string
        selectedRating = e.currentTarget.getAttribute('data-rating');
    });
});

// 3. (Inside your submission function) Make sure 'userRating' is part of your payload:
/*
const payload = {
    // ... your other category metrics ...
    userRating: selectedRating 
};
*/

// 4. Handle the graceful exit flow for the "Finish & Close" button
const exitBtn = document.getElementById('exit-btn');
if (exitBtn) {
    exitBtn.addEventListener('click', () => {
        const completionScreen = document.getElementById('completion-screen');
        if (completionScreen) {
            completionScreen.innerHTML = `
                <h2>Thank You!</h2>
                <p><em>Your intuitive choices have been recorded. You may now close this window or tab.</em></p>
            `;
        }
    });
}
        // Attach listeners to the dynamically injected smiley buttons
        document.querySelectorAll('.smiley-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.smiley-btn').forEach(btn => btn.classList.remove('selected'));
                e.currentTarget.classList.add('selected');

                const enjoymentScore = e.currentTarget.getAttribute('data-score');
                if (typeof telemetryData !== 'undefined') {
                    telemetryData.enjoyment = enjoymentScore;
                }
            });
        });
    }
</script>
</body>
</html>
