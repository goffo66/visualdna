<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual DNA</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background-color: #0f0f11 !important;
            color: #f1f1f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 15px 20px;
            justify-content: space-between;
        }
        header {
            text-align: center;
            padding: 5px 0;
            flex-shrink: 0;
        }
        h1 {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            font-weight: 500;
        }
        .top-progress-bar {
            width: 100%;
            height: 3px;
            background: #27272a;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .top-progress-fill {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 0.8rem;
            color: #52525b;
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .card-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            margin: 10px 0;
            overflow: hidden;
        }
        .card {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            width: 100%;
            height: 100%;
            max-height: 520px;
            aspect-ratio: 9 / 16;
            background: #18181b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            cursor: grab;
            transform: translate3d(0, 0, 0);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
        .card-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e1e24;
            color: #a1a1aa;
            padding: 20px;
            text-align: center;
            gap: 10px;
        }
        .card-fallback span {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f1f3;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card-fallback p {
            font-size: 0.8rem;
            color: #71717a;
            word-break: break-all;
        }
        .actions {
            display: flex;
            gap: 20px;
            padding: 10px 0;
            height: 90px;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, background 0.2s;
            background: #18181b;
            touch-action: manipulation;
        }
        .icon-btn:active {
            transform: scale(0.90);
        }
        .btn-left {
            border: 2px solid #3f3f46;
        }
        .btn-left:hover {
            background: #27272a;
            border-color: #ef4444;
        }
        .btn-left svg {
            fill: #ef4444;
            width: 26px;
            height: 26px;
            pointer-events: none;
        }
        .btn-right {
            border: 2px solid #3f3f46;
        }
        .btn-right:hover {
            background: #27272a;
            border-color: #10b981;
        }
        .btn-right svg {
            fill: #10b981;
            width: 28px;
            height: 28px;
            pointer-events: none;
        }
        .results {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            height: 100%;
            padding: 24px 0 30px 0;
            overflow-y: auto;
            width: 100%;
        }
        .results h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .subtitle-heading {
            font-size: 0.8rem;
            color: #10b981;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 14px;
        }
        
        .toggle-container {
            display: flex;
            background: #27272a;
            border-radius: 25px;
            padding: 4px;
            margin-bottom: 18px;
            width: 100%;
            max-width: 320px;
        }
        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #a1a1aa;
            padding: 9px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .toggle-btn.active {
            background: #3b82f6;
            color: #f1f1f3;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .graph-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 5px;
            text-align: left;
            padding-bottom: 10px;
        }
        .graph-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #18181b;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #27272a;
        }
        .graph-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #f1f1f3;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .graph-stats {
            font-size: 0.75rem;
            color: #71717a;
            font-weight: normal;
        }
        .bar-background {
            width: 100%;
            height: 10px;
            background: #27272a;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 2px;
        }
        .bar-fill {
            height: 100%;
            background: #10b981;
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .category-desc {
            font-size: 0.8rem;
            color: #a1a1aa;
            line-height: 1.4;
            margin-top: 4px;
        }
        .restart-btn {
            margin: 20px 0 30px 0;
            background: #27272a;
            color: #f1f1f3;
            border: 1px solid #3f3f46;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, border-color 0.2s;
            touch-action: manipulation;
        }
        .restart-btn:hover {
            background: #3f3f46;
            border-color: #52525b;
        }

        .splash-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: #0f0f11;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 9999;
          overflow-y: auto;
          padding: 12px 15px;
        }

        .splash-content {
          max-width: 360px;
          width: 100%;
          text-align: center;
          color: #ffffff;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          display: flex;
          flex-direction: column;
          gap: 8px;
          margin: auto;
        }

        .splash-content h1 {
          font-size: 22px;
          font-weight: 800;
          letter-spacing: 2px;
          margin: 0;
        }

        .splash-content h2 {
          font-size: 14px;
          font-weight: 400;
          color: #aaaaaa;
          margin-top: -4px;
          margin-bottom: 2px;
        }

        .visual-guide-card {
          background-color: #18181b;
          border: 1px solid #27272a;
          border-radius: 14px;
          padding: 8px;
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .guide-image-container {
          width: 100%;
          max-width: 220px;
          border-radius: 8px;
          overflow: hidden;
          background: #111115;
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
          margin: 0 auto;
        }

        .guide-image-container img {
          width: 100%;
          height: auto;
          display: block;
          object-fit: contain;
        }

        .splash-instructions {
          font-size: 12px;
          color: #cccccc;
          line-height: 1.35;
          margin: 0 4px;
        }

        .start-btn {
          background-color: #10b981 !important;
          color: #ffffff !important;
          border: none !important;
          border-radius: 14px !important;
          padding: 14px !important;
          font-size: 16px !important;
          font-weight: 700 !important;
          cursor: pointer !important;
          width: 100% !important;
          box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3) !important;
          letter-spacing: 1px !important;
          display: block !important;
          position: relative;
          z-index: 10000;
          touch-action: manipulation;
        }

        .start-btn:hover {
          background-color: #059669 !important;
        }
    </style>
</head>
<body>

<!-- Splash Screen Overlay -->
<div id="splash-screen" class="splash-overlay">
  <div class="splash-content">
    <h1>VISUAL DNA</h1>
    <h2>in 60 seconds</h2>

    <div class="visual-guide-card">
      <div class="guide-image-container">
        <img src="images/guide.jpg" alt="Visual DNA Guide" onerror="this.parentElement.innerHTML='<div style=\'padding:20px; text-align:center; font-size:12px; color:#888;\'>images/guide.jpg not found</div>'">
      </div>
    </div>

    <p class="splash-instructions">
      Take about 60 seconds. Go with your first instinct — swipe left to pass, swipe right if it resonates.
    </p>

    <button id="start-test-btn" class="start-btn" onclick="startQuizDirectly()">START TEST</button>
  </div>
</div>

<div class="container">
    <header id="appHeader">
        <h1>Visual DNA</h1>
        <div class="top-progress-bar">
            <div class="top-progress-fill" id="topProgressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Image 1 of 50</div>
    </header>
    
    <div class="card-container" id="cardContainer">
        <!-- Dynamic card injection -->
    </div>

    <div class="actions" id="actionButtons">
        <button class="icon-btn btn-left" onclick="handleChoice(0)" title="Pass">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <button class="icon-btn btn-right" onclick="handleChoice(1)" title="More of this">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
    </div>
</div>
